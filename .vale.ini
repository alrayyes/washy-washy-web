StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. Google is the general
# technical-writing style; proselint is the editorial layer on top of it —
# clichés, redundancy, corporate speak — and reads Markdown properly, which the
# standalone proselint binary does not.
#
# Pinned by release URL rather than named. A bare name is a lookup in Vale's
# package registry that resolves to whatever is newest, which is the same
# floating dependency this project refuses everywhere else — a style package
# gaining a rule would fail a pipeline over prose nobody had touched.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

# Vale rejects Vocab inside a syntax section, so it sits up here with the other
# core options even though it only has Markdown to act on.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# Holds this document to the spellings in the vocabulary rather than merely
# tolerating them, so "Github", "NPM" and "javascript" get flagged where GitHub,
# npm and JavaScript are the accepted forms.
Vale.Terms = YES

# Spelling is LTeX's. Its dictionary is LanguageTool's rather than a word list,
# so it knows technical terms are words, and two tools underlining the same
# word is how you learn to ignore both.
Vale.Spelling = NO

# Google's style guide is American and this prose is not. Spaced em dashes, no
# serial comma, and punctuation outside the quotation marks unless it was in the
# quoted text — all house style rather than mistakes to fix.
Google.EmDash = NO
Google.OxfordComma = NO
Google.Quotes = NO

# Reads the repo's own name and bare acronyms as capitalization errors — every
# hit so far has been one, and none of them had a fix worth making.
Google.Headings = NO

# The product is called "washy-washy" — a deliberate repeated word, not a
# typo the rule is right to catch.
Vale.Repetition = NO

# Google and proselint are English-language style guides — run against the
# translated docs (#143/#144) they misread ordinary foreign-language prose
# as English mistakes (proselint.Diacritical flagging French "touche" as a
# typo for "touché", the loanword, is the one that actually happened).
# Overrides the general [*.md] section above for anyone matching both: this
# section is more specific and comes later, and Vale resolves a directive
# repeated across matching sections by taking the last one, the same way a
# more specific CSS rule wins by appearing after a general one. Vale.Terms
# (product-name casing) still applies — that's language-independent.
[src/content/docs/{ja,de,es,fr}/**/*.md]
BasedOnStyles = Vale

# Same reasoning as the section above — jive's docs (#144) are a deliberate
# comedic dialect, not standard technical-writing English, so Google's
# formal-register rules (Exclamation, contractions, and the rest) fight the
# whole point of the thing rather than catch a real mistake.
[src/content/docs-jive/**/*.md]
BasedOnStyles = Vale
