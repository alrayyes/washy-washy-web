config:
  # Prose wraps where it reads best; a hard column limit fights that.
  MD013: false
  # The README opens with a badge row, not a heading.
  MD041: false

  # Below here: layout Prettier already decides. Prettier runs first and
  # markdownlint judges what it produced, so leaving these on would only give us
  # a hook that fails twice and fixes nothing.
  # List markers.
  MD004: false
  # List indentation.
  MD007: false
  # Consecutive blank lines.
  MD012: false
  # Emphasis characters.
  MD049: false
  MD050: false

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "dist/**"
  # Written by semantic-release from the commit subjects, and committed by the
  # release job without passing through any hook. Linting it means failing a
  # run over prose no human chose and no human can fix in place.
  - "CHANGELOG.md"
  # Playwright's own error-context.md dumps, written into a linked worktree's
  # gitignored test-results/ during a local e2e run. .gitignore already
  # excludes test-results anywhere in the tree, but that doesn't reach past
  # a nested worktree's own .git boundary the way this glob does — hit for
  # real when a worktree under .claude/worktrees/ had a stale run sitting in
  # it (#111).
  - ".claude/worktrees/**"
