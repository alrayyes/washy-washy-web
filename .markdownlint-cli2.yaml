config:
  # Prose wraps where it reads best; a hard column limit fights that.
  MD013: false
  # The README opens with a badge row, not a heading.
  MD041: false

  # Below here: layout Prettier already decides. Prettier runs first and
  # markdownlint judges what it produced, so leaving these on would only give us
  # a hook that fails twice and fixes nothing.
  # List markers.
  MD004: false
  # List indentation.
  MD007: false
  # Consecutive blank lines.
  MD012: false
  # Emphasis characters.
  MD049: false
  MD050: false

  # A theme-matched docs screenshot is a light/dark pair of <img>, toggled
  # by CSS (global.css's .theme-shot rules, #127) — plain ![]() syntax has
  # no way to attach the class/data attribute that needs. Scoped to img
  # rather than a blanket MD033: false, so any other raw HTML still gets
  # flagged.
  MD033:
    allowed_elements:
      - img

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "dist/**"
  # Written by semantic-release from the commit subjects, and committed by the
  # release job without passing through any hook. Linting it means failing a
  # run over prose no human chose and no human can fix in place.
  - "CHANGELOG.md"
  # Playwright's own error-context.md dumps, written into test-results/
  # during a local e2e run. .gitignore already excludes test-results
  # anywhere in the tree, which is enough for the main worktree itself
  # (hit for real from a leftover run here, #130) — but doesn't reach
  # past a nested worktree's own .git boundary, which is what the
  # explicit .claude/worktrees/** entry below is for (#111).
  - "**/test-results/**"
  - "**/playwright-report/**"
  - ".claude/worktrees/**"
