[install]
# Pin new dependencies to exact versions by default, without --exact on
# every `bun add`.
exact = true
# Wait 7 days before resolving a newly published version. Matches
# Dependabot's 7-day cooldown, and semgrep requires it on the install
# section.
minimumReleaseAge = 604800

[test]
# Bun's 5 s per-test default is barely twice the slowest PDF and chart tests
# (about 2.4 s on an idle machine). The pre-push hook runs them beside ten
# other jobs, and load pushed them over the limit (#402). CI never hit it.
timeout = 30000
# Compiles `.svelte` imports (server-rendered by default, client-rendered
# for a `?client`-suffixed import) before `bun test` evaluates them — see
# the preload file's own comment for why this is needed and why it's
# scoped to `[test]` alone (#243).
preload = ["./test/support/svelteCompile.ts"]
