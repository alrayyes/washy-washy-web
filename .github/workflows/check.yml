# Runs the same commands as the git hooks in lefthook.yml, so the two cannot
# drift: the hook catches it early, this is the gate that cannot be skipped.
#
# Every action is pinned to a commit SHA with the version in the comment. A tag
# like v7 is a mutable pointer someone else controls, and a workflow with write
# permission is not a thing to hand to a moving target.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes an older run cancels it rather than queueing behind it.
# main is excluded: its runs are what the release job waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Six ignored advisories, all transitive and all dev-only (never
      # shipped) - `bun audit fix` can't reach any of them:
      #   - Five (incl. the two extract-zip IDs) run through @lhci/cli
      #     (Lighthouse CI) - extract-zip has no published fix at all, and
      #     lhci's own tmp/uuid ranges block the rest.
      #   - GHSA-rgj7-g3m4-5g8c (sharp) runs through wrangler > miniflare,
      #     which pins sharp@0.35.2 exactly - astro's own sharp already
      #     resolves to the fixed 0.35.4, this is only miniflare's local
      #     dev-server copy.
      # Revisit when @lhci/cli/miniflare bump their own pinned dependencies.
      - run: >-
          bun audit
          --ignore GHSA-jmr9-qjv8-65gv
          --ignore GHSA-52f5-9888-hmc6
          --ignore GHSA-ph9p-34f9-6g65
          --ignore GHSA-w5hq-g745-h8pq
          --ignore GHSA-7pqw-9j4j-h8q3
          --ignore GHSA-rgj7-g3m4-5g8c
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run lint:package-json
      - run: bun run lint:yaml
      - run: bun run typecheck
      - run: bun run check
      - run: bun run build
      # Coverage instrumentation slows the suite down, which is why the
      # pre-push hook runs plain `bun run test` and only CI pays for this.
      # --reporter=junit alongside the coverage flags, not instead of them:
      # Codecov Test Analytics (below) reads the JUnit file for
      # failure/flake history, coverage-reporter=lcov still feeds the
      # coverage upload.
      - run: bun --conditions=browser test test/ --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml
      # Regular repo secrets, CODECOV_TOKEN included, aren't exposed to runs
      # triggered by dependabot[bot] on pull_request -- a GitHub security
      # boundary, not a config gap. Skip the upload there rather than fail
      # every dependency bump on an empty token.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
      # Codecov Test Analytics: per-test failure/flake detail, not just a
      # coverage delta. !cancelled(), not the step default - this still
      # runs when the test step above failed (junit.xml exists either way;
      # that's the case Test Analytics is actually for), but not if the
      # whole run was cancelled out from under it. Same dependabot
      # exemption as the coverage upload, same reason.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

  # A green `bun test` only proves the existing assertions still pass, not
  # that they'd catch a real change to the code under test. Stryker mutates
  # one change at a time and re-runs the suite against each mutant;
  # `thresholds.break: 100` in stryker.config.mjs means a single surviving
  # mutant fails this job the same way a failing assertion would. Its own
  # job rather than a line in `check`, so a mutation-testing failure reads
  # as "the suite has a gap" rather than "the code is broken".
  #
  # Scoped to files this PR actually changed (or, on a push to main, the
  # last commit's own files), not stryker.config.mjs's full `mutate` list —
  # per rules/testing.md, inherited mutation-testing debt gets a tracked
  # issue rather than blocking every unrelated PR on gaps it didn't
  # introduce. `thresholds.break: 100` still applies to whatever's in scope
  # for a given run — no ratchet, just a narrower set.
  #
  # #219 closed both of that issue's holes: src/lib and src/i18n now cover
  # every file in each directory (including urlHistory.ts — see
  # stryker.config.mjs's own comment for why it was excluded before and
  # isn't anymore), plus the pure-render-logic components that used to be
  # three .tsx files and are now their Svelte ports (dials.tsx/
  # SectionHeading.tsx/TranslationProvider.tsx are all deleted — #245 was
  # the last consumer). The rest of the .tsx/.astro layer stays a
  # deliberate, permanent exclusion — not debt — for the same reason
  # stryker.config.mjs documents.
  #
  # src/i18n/ui.ts: #251 found the real cause, with real evidence from
  # three dedicated CI runs (not local — this genuinely doesn't reproduce
  # on a dev machine with cores to spare). Only its `en` dictionary (~200
  # of the file's 2210 mutants) is expensive: test/sheet-render.test.ts,
  # test/sheet-actions.test.ts and test/sheet-fields.test.ts all hardcode
  # `translator("en")`, so per-test coverage correctly attributes every
  # `en`-dictionary mutant to those three files too, not just
  # test/ui.test.ts — and all three mount real Svelte components through
  # test/support/svelteCompile.ts's preload plugin, which recompiles from
  # scratch on every single spawned `bun test` process (no cross-process
  # cache). A same-size slice of a different locale (`ru`, covered only by
  # the lightweight test/ui.test.ts) confirmed the gap directly: 200
  # mutants in 24 seconds locally, versus the `en` dictionary's ~9 seconds
  # *per mutant* even when nothing else is running.
  #
  # On a real GitHub Actions runner (4 vCPUs) two or more of those heavy,
  # Svelte-recompiling `bun test` processes running at once are enough to
  # starve each other into blowing past their timeout — confirmed with
  # three real CI runs against the same ~200-mutant `en` slice:
  # concurrency 4 (the default) timed out 186/200 (93%); concurrency 2 was
  # no better, 184/200 (92%), and slower besides (16m12s vs 8m20s) — ruling
  # out a smooth contention curve; concurrency 1 timed out *none* of the
  # 186 it got through before hitting this diagnostic job's own budget,
  # each mutant a consistent ~9s. This never showed up locally because a
  # dev machine has cores to spare beyond whatever `concurrency` asks for;
  # a CI runner sized to exactly match `concurrency: 4` (this repo's own
  # default, tuned for a 16-core dev machine, not a 4-vCPU runner) has
  # none.
  #
  # The fix needs two things together, confirmed by two separate real CI
  # runs against the full 2210-mutant file (not just the `en` slice):
  #
  # 1. `--concurrency 1` alone wasn't enough: still ~93% timeouts, no
  #    different from concurrency 2. The #250 typescript checker is why —
  #    Stryker "will always run checkers and test runners in parallel"
  #    (its own --help text), a *second* concurrent process regardless of
  #    `--concurrency`, silently reintroducing the same contention.
  #    199/200 of the `en` dictionary's own mutants are plain
  #    `StringLiteral` swaps that can never fail to compile (confirmed
  #    locally), so `--checkers ""` disables it for just this run.
  # 2. `--concurrency 1 --checkers ""` together genuinely eliminate the
  #    false timeouts (confirmed: 540/2210 mutants tested, 0 survived, 0
  #    timed out) — but applied to the *whole* file, this serializes the
  #    ~2000 mutants that were never the problem too, on top of a fixed
  #    per-mutant startup cost that no longer has anything to amortize
  #    against. Real math from that same run: 540 mutants in 74 minutes,
  #    extrapolating to ~5 hours for the full file. A same-size slice of
  #    a different locale (`ru`, covered only by the lightweight
  #    test/ui.test.ts, no Svelte compilation at all) already showed
  #    these mutants are individually cheap; running all ~2000 of them
  #    together, still parallel, confirmed it locally: 20 minutes, 0
  #    timeouts.
  #
  # So the mutation run is split into two passes when ui.ts is touched:
  # the `en` dictionary alone, isolated and serialized; everything else
  # (ui.ts's other ~2000 mutants, plus any other file this PR also
  # changed) at the normal, fully-parallel default. The boundary is found
  # by grepping for `en`'s own declaration and the next one after it
  # (`ja`), not a hardcoded line range — self-adjusting if ui.ts's own
  # structure ever changes, rather than silently mutating the wrong slice.
  mutation:
    runs-on: ubuntu-latest
    # Generous on purpose: the `en`-dictionary pass alone runs its ~200
    # mutants serialized (~9s each, ~30 minutes) precisely because that's
    # now a known, deliberate trade-off (reliable over fast) rather than
    # something to keep shaving down — see the comment above.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Find changed files eligible for mutation testing
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" -- \
              src/lib src/i18n \
              src/components/ProgramDial.svelte src/components/IronDial.svelte \
              src/components/SectionHeading.svelte \
              src/components/Sheet.svelte src/components/CardActions.svelte \
            | grep -E '\.(tsx?|svelte)$' || true)
          {
            echo "files<<STRYKER_FILES_EOF"
            echo "$FILES"
            echo "STRYKER_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            exit 0
          fi
          if echo "$FILES" | grep -qx "src/i18n/ui.ts"; then
            EN_START=$(grep -n "^const en: Ui = {" src/i18n/ui.ts | head -1 | cut -d: -f1)
            EN_END_LINE=$(grep -n "^const ja: Ui = {" src/i18n/ui.ts | head -1 | cut -d: -f1)
            REST=$(echo "$FILES" | grep -vx "src/i18n/ui.ts" | paste -sd, -)
            if [ -n "$EN_START" ] && [ -n "$EN_END_LINE" ]; then
              EN_END=$((EN_END_LINE - 1))
              TOTAL=$(wc -l < src/i18n/ui.ts)
              echo "en_range=src/i18n/ui.ts:${EN_START}-${EN_END}" >> "$GITHUB_OUTPUT"
              UI_REST="src/i18n/ui.ts:1-$((EN_START - 1)),src/i18n/ui.ts:$((EN_END + 1))-${TOTAL}"
              if [ -n "$REST" ]; then
                echo "mutate_target=${REST},${UI_REST}" >> "$GITHUB_OUTPUT"
              else
                echo "mutate_target=${UI_REST}" >> "$GITHUB_OUTPUT"
              fi
            else
              # The en/ja boundary markers didn't match — ui.ts's own
              # structure changed in a way this grep no longer expects.
              # Fall back to serializing the whole file rather than risk
              # a silently wrong split; see the comment above this job.
              echo "::warning::Could not find ui.ts's en/ja dictionary boundary — serializing the whole file at --concurrency 1 instead of just the en dictionary."
              echo "en_range=src/i18n/ui.ts" >> "$GITHUB_OUTPUT"
              echo "mutate_target=${REST}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mutate_target=$(echo "$FILES" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run mutation testing on the changed files (excluding ui.ts's own en dictionary, if present)
        if: steps.changed.outputs.mutate_target != ''
        run: >-
          bunx stryker run
          --mutate "${{ steps.changed.outputs.mutate_target }}"
      - name: Run mutation testing on ui.ts's own en dictionary in isolation (see the comment above)
        if: steps.changed.outputs.en_range != ''
        run: >-
          bunx stryker run
          --mutate "${{ steps.changed.outputs.en_range }}"
          --concurrency 1
          --checkers ""
      - name: Nothing to mutate
        if: steps.changed.outputs.files == ''
        run: echo "No src/lib or src/i18n changes in this diff — nothing to mutate."

  # Real browser, real clicks — the layer type checks and static-markup
  # assertions can't reach. Runs against a plain static file server over a
  # real `astro build`, not astro dev/preview: both of those daemonize and
  # exit immediately once started, which reads as a crash to Playwright's
  # own server-management. See playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # ,junit alongside the CI reporter Playwright already uses (its own
      # config default), not instead of it - Codecov Test Analytics reads
      # the JUnit file, GitHub's own annotations still come from the other
      # one.
      - run: bunx playwright test --reporter=github,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-e2e.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Codecov Test Analytics for the e2e suite too - same
      # !cancelled()/dependabot-exempt reasoning as the check job's own
      # upload step above.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-e2e.xml
          report_type: test_results
          fail_ci_if_error: true

  # Category-score gates against a real astro build — see lighthouserc.cjs
  # for what's asserted and why performance is a warning rather than a hard
  # gate. ubuntu-latest ships Chrome already, so there's nothing extra to
  # install.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lighthouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # The commit-msg hook already reads every message, but a hook is skippable and
  # these messages are load-bearing: semantic-release reads the Conventional
  # Commits that landed to decide the next version, so a stray "wip" is a
  # release that does not happen. Pull requests only — there is no range to
  # check on a push, and rewriting history to fix an old message is worse than
  # the typo. fetch-depth 0 because the range needs both ends of it.
  #
  # Dependabot is exempt. Its subject is always "Bump x from a to b", and
  # config-conventional's subject-case rule rejects the capital B — which is
  # not something a bot can be argued with about. What lands on main is
  # normalised by the auto-merge workflow's squash subject instead, so main
  # stays conventional without this job failing on every dependency bump.
  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # commitlint resolves @commitlint/config-conventional as a sibling
      # package, so bunx alone will not find it.
      - run: bun install --frozen-lockfile
      - run: bunx --bun commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # Public repo, so this actually catches something Dependabot's own schedule
  # doesn't: a PR introducing a *new* dependency that's already known-bad,
  # checked at merge time rather than waiting for the next scan.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Biome's pattern-based rules (the lint step above) can't do cross-file
  # taint tracking; this is the separate security pass that can — the free
  # Semgrep Registry ruleset, no paid tier or account needed. Same shape as
  # alrayyes/movie-planner-web's ci.yml.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error

  # Prose gets its own two jobs rather than a line in the one above, so that
  # when the run goes red the job name says which tier failed: a grammar error
  # is a mistake and a style alert is an opinion, answered differently.

  # Mechanics. LanguageTool's rule database — grammar, spelling, punctuation,
  # the phonetic article — and mechanics have a right answer, so this blocks.
  ltex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ghcr.io/alrayyes/ltex-cli-plus is built once by that repo, not fetched
    # fresh here: `ltex-cli-plus` is already on PATH, its own bundled Java
    # runtime already wired up, so this job's setup is just what
    # actions/checkout itself needs.
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus@sha256:bf8c54087ad5418da57d9ef5a9604b4dd70aa0737fa0d732b2a2d5cd81e64c18 # 18.7.0
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # It reports findings with exit code 3, not 1, so a step testing for a
      # specific code would pass a failing document. Let the shell judge
      # non-zero. The files are named rather than passing `.`: LTeX traverses
      # recursively and reads plain text as prose, so a bare dot lints the
      # committed Vale vocabulary as though it were a document. The docs site
      # (#12) is plain Markdown, so it's named alongside them rather than
      # exempted — passing the directory is safe because it holds nothing but
      # genuine prose, unlike the repo root.
      #
      # .ltex.json disables ENGLISH_WORD_REPEAT_RULE for the same reason
      # .vale.ini turns Vale.Repetition off: the product is called
      # "washy-washy", a deliberate repeated word, not a typo either rule
      # would otherwise be right to catch.
      - run: ltex-cli-plus --client-configuration=.ltex.json README.md CONTRIBUTING.md SECURITY.md src/content/docs/docs

  # Style. House voice, weasel words, wordiness, undefined jargon. Advice
  # rather than a verdict: Vale exits non-zero only on error-severity alerts,
  # so its warnings are reported without failing anything.
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run prose:sync
      - run: bun run lint:prose:advice
