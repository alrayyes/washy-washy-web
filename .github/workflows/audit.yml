# Replaces the `bun audit` step that lived in check.yml behind a list of
# thirteen --ignore flags (#356). Pull requests run the gate: it fails only on
# advisories the pull request adds to bun.lock, so a newly published advisory
# can't turn an unrelated pull request red. The default branch runs the scan,
# which keeps one open "Dependency advisories" issue listing everything else.
# Neither takes an ignore list: a known advisory with no fix lives in that
# issue until a fix ships.
#
# The scan runs daily for advisories published against pins that haven't
# moved, on a lockfile push so a merged fix closes the issue straight away,
# and by hand.
name: audit

on:
  pull_request:
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  push:
    branches: [main]
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # bun audit reads the lockfile, so no install is needed on either side.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: gate
          command: bun audit

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: scan
          command: bun audit
          labels: dependencies
