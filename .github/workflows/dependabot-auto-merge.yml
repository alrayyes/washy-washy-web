# Every Dependabot bump, major included, merges itself once every check has
# passed.
#
# This is not a licence for a bot to commit whatever it likes. GitHub's
# auto-merge holds the pull request until the required checks are green and the
# branch is up to date, so the tests are still the gate — the only thing given
# away is the click. Everything else still goes through a human.
name: dependabot auto-merge

on: pull_request_target

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # pull_request_target runs with write access against the base repository,
    # so it must never check out or execute the pull request's code. This job
    # runs one gh command and nothing else. The actor check is what stops a
    # branch named to look like Dependabot's from reaching it.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The merge is armed as github-actions, not as a person, so GitHub doesn't
    # subscribe the repo owner to every Dependabot thread (#336). Auto-merge
    # needs write on contents and pull requests to be armed at all.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Squashed with a subject commitlint accepts. Dependabot writes "Bump x
      # from a to b" and config-conventional refuses the capital B, so the
      # commit that reaches main is retitled here rather than the rule being
      # relaxed for everyone else.
      #
      # --auto is the whole safety story: it holds the pull request until the
      # required checks on main have passed. Without a ruleset naming those
      # checks it merges the moment the branch is mergeable, red or not.
      #
      # GITHUB_TOKEN, not the owner's RELEASE_TOKEN: a PAT makes its owner the
      # person who armed auto-merge, which subscribes them to the thread and
      # notifies them of every comment, rebase and merge (#336).
      #
      # The cost is that a GITHUB_TOKEN merge fires no push-triggered run, so
      # check.yml never runs on the merge commit and release.yml never sees it
      # (#212). So this job stays alive until the merge lands, then dispatches
      # check.yml on main, which release.yml follows. workflow_dispatch is
      # exempt from the guard, so the release is as prompt as after a push.
      - name: Wave it through once the checks are green
        run: |
          subject=$(printf '%s' "$PR_TITLE" | sed -E 's/^([a-z]+(\([^)]*\))?: )([A-Z])/\1\l\3/')
          gh pr merge --auto --squash --subject "$subject" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the release run once it has merged
        run: |
          for _ in $(seq 1 80); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED) gh workflow run check.yml --ref main; exit 0 ;;
              CLOSED) exit 0 ;;
            esac
            sleep 30
          done
          echo "::warning::Not merged after 40 minutes; nothing dispatched."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
