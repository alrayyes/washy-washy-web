# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# release-please keeps a release pull request open with the next version and
# its CHANGELOG.md entry; release-auto-merge.yml merges it once green, and the
# run that follows tags it. Nothing here pushes to main. Cloudflare's own
# GitHub integration handles the deploy on every push to main, so there's no
# publish step either.
name: release

# After check, not on push: nothing is released from a commit that didn't pass,
# and dependabot-auto-merge.yml's dispatched check run releases too, though its
# GITHUB_TOKEN merge fired no push event.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # The event test keeps a pull request's check run, a fork's included, from
    # ever reaching a job that holds RELEASE_TOKEN: only a push to main or a
    # dispatch (which needs write access) gets through. See GitHub Security
    # Lab's "Preventing pwn requests".
    if: contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Everything the action does, it does as RELEASE_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Not GITHUB_TOKEN: GitHub holds back every workflow on a pull request it
      # authored, so the release pull request could never go green. Not wrapped
      # in a retry action either; a failed run gets re-run by hand.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # release-please leaves the release as a draft (its tag already pushed), and
  # this job publishes it once the README's screenshots are attached, so
  # releases/latest/download/ never points at a release without them. If it
  # fails, use "Re-run failed jobs" (CONTRIBUTING.md has the rest).
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      LEFTHOOK: "0"
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run readme:shots

      # --latest only when nothing newer is published: a late re-run of an older
      # release must not move releases/latest, and the README with it, back.
      # GitHub's secondary rate limit clears within a minute or two. --clobber
      # makes a second attempt safe.
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          command: |
            gh release upload "$TAG_NAME" screenshots/*.png --clobber &&
              published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName') &&
              latest=$(bun scripts/latest-flag.ts "$TAG_NAME" <<< "$published") &&
              gh release edit "$TAG_NAME" --draft=false "$latest"
          shell: bash
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 30
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Label what shipped
        run: |
          notes=$(gh release view "$TAG_NAME" --json body --jq .body)
          url=$(gh release view "$TAG_NAME" --json url --jq .url)
          refs=$(bun scripts/released-refs.ts "$GH_REPO" <<< "$notes")
          for number in $refs; do
            gh issue edit "$number" --add-label released ||
              gh pr edit "$number" --add-label released ||
              echo "::warning::could not label #$number"
            gh issue comment "$number" --body "Released in [$TAG_NAME]($url)." ||
              echo "::warning::could not comment on #$number"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
