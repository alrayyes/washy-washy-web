# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# This is the one workflow that writes to main: the version and the
# changelog. Cloudflare's own GitHub integration handles the actual deploy
# on every push to main, so there's no publish step here — this job is
# versioning and release notes only.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # event == 'push' (not just conclusion == 'success') is the actual guard
    # against the "pwn request" pattern workflow_run is infamous for: without
    # it, a pull_request-triggered `check` run — including one from a fork —
    # could complete successfully and trigger this job, which checks out
    # workflow_run.head_sha (untrusted, attacker-controlled on a fork PR) and
    # runs `bun install` (arbitrary lifecycle scripts) plus semantic-release
    # with a repo-write RELEASE_TOKEN. Restricting to `push` means the only
    # thing that can ever reach this job is `check.yml`'s own push-to-main
    # trigger — i.e. a commit already merged into this repo, never a PR's
    # unreviewed head. See GitHub Security Lab's "Preventing pwn requests".
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Is the release token here?
        id: token
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set, so nothing was released."
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Reviewed false positive, Ryan sign-off 2026-09-11: the job-level `if:`
      # above (github.event.workflow_run.event == 'push') already makes this
      # safe -- workflow_run only ever fires for a run completed inside this
      # same repo, so a fork's PR can never reach this job or its head_sha.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: 1.3.14

      # bun installs it; Node runs it — semantic-release checks the runtime
      # version at startup and refuses anything outside ^22.14 || >=24.10.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24.10.0

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.present == 'true'

      - run: ./node_modules/.bin/semantic-release
        if: steps.token.outputs.present == 'true'
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
